name: pharmahome-demo
services:
  web:
    build:
      context: ../..
      dockerfile: deployment/vps/Dockerfile
    image: scalaris/pharmahome-demo:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:18093:8080'
    networks:
      proxy:
        aliases:
          - pharmahome-demo-web
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
networks:
  proxy:
    external: true
